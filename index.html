<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranking Gamificado DBV</title>

    <!-- Meta Tags para Redes Sociais (Open Graph / WhatsApp) -->
    <meta property="og:title" content="Ranking Gamificado DBV - Rumo ao Campori 2027">
    <meta property="og:description" content="Acompanhe o saldo da nossa unidade! Veja quem está na liderança e quanto falta para as metas de Ônibus e Alimentação.">
    <meta property="og:image" content="https://images.unsplash.com/photo-1537225228614-56cc3556d7ed?q=80&w=1200&auto=format&fit=crop">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="theme-color" content="#4f46e5">

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* ==========================================
           ESTILOS BASE
           ========================================== */
        body {
            background-color: #020617; /* slate-950 */
            color: #f1f5f9; /* slate-100 */
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            overflow-x: hidden;
        }

        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        }

        /* ==========================================
           ANIMAÇÕES
           ========================================== */
        @keyframes slideInBounce {
            0% { opacity: 0; transform: translateY(60px) scale(0.9); }
            60% { opacity: 1; transform: translateY(-5px) scale(1.02); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        
        .animate-entrance {
            animation: slideInBounce 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) backwards;
        }

        @keyframes floatBg1 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(5vw, -5vh) scale(1.1); }
            66% { transform: translate(-3vw, 4vh) scale(0.9); }
        }
        .bg-glow {
            position: fixed; border-radius: 50%; filter: blur(120px); pointer-events: none; z-index: -1;
        }
        .bg-glow-1 { animation: floatBg1 18s infinite ease-in-out; }

        @keyframes textShimmer {
            0% { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }
        .animate-title-gradient {
            background-size: 200% auto;
            animation: textShimmer 4s linear infinite;
        }

        @keyframes flame-pulse {
            0%, 100% { transform: scale(1) rotate(-2deg); filter: drop-shadow(0 0 8px rgba(249,115,22,0.8)) brightness(1); }
            50% { transform: scale(1.15) rotate(2deg); filter: drop-shadow(0 0 16px rgba(249,115,22,1)) brightness(1.2); }
        }
        .animate-flame {
            animation: flame-pulse 1.5s infinite ease-in-out;
            color: #f97316; 
        }

        /* Progress Bar Shimmer */
        .progress-fill {
            position: relative; overflow: hidden;
            transition: width 1.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        
        @keyframes shimmerBar {
            0% { transform: translateX(-150%) skewX(-20deg); }
            100% { transform: translateX(250%) skewX(-20deg); }
        }
        .progress-fill::after {
            content: ''; position: absolute; top: 0; left: -20px; bottom: 0; width: 40px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            animation: shimmerBar 3s infinite linear;
        }

        /* Ranking List */
        #ranking-list {
            position: relative; width: 100%; transition: height 0.5s ease;
        }

        .ranking-item-wrapper {
            position: absolute; left: 0; right: 0;
            transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            height: 105px;
        }

        .inner-card {
            height: 100%; position: relative;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 1;
        }

        .ranking-item-wrapper:hover .inner-card {
            transform: translateY(-4px) scale(1.015);
            box-shadow: 0 15px 35px -5px rgba(0, 0, 0, 0.6), 0 0 15px rgba(99, 102, 241, 0.2);
            border-color: rgba(99, 102, 241, 0.4) !important;
            z-index: 20;
        }

        /* Partículas */
        @keyframes sparkUp {
            0% { transform: translateY(0) scale(1); opacity: 0; }
            20% { opacity: 1; }
            100% { transform: translateY(-60px) scale(0); opacity: 0; }
        }
        .spark {
            position: absolute; width: 3px; height: 3px; background: #fbbf24; border-radius: 50%;
            box-shadow: 0 0 8px #f59e0b; pointer-events: none; opacity: 0;
        }
    </style>
</head>
<body class="min-h-screen p-4 sm:p-8 relative selection:bg-indigo-500/30">

    <div class="bg-glow bg-glow-1 w-[45vw] h-[45vw] bg-indigo-600/20 top-[-15%] left-[-10%]"></div>
    <div class="bg-glow bg-glow-1 w-[40vw] h-[40vw] bg-orange-600/15 bottom-[-10%] right-[-10%]"></div>

    <main class="max-w-3xl mx-auto relative z-10">
        <header class="text-center mb-8 mt-6 animate-entrance" style="animation-delay: 0.1s">
            <div class="inline-flex items-center justify-center p-3 glass-panel rounded-full mb-4 shadow-[0_0_20px_rgba(99,102,241,0.2)]">
                <svg class="w-8 h-8 text-indigo-400 mr-2 animate-[spin_10s_linear_infinite]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"></circle>
                    <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"></polygon>
                </svg>
                <h1 class="text-3xl sm:text-4xl font-extrabold bg-clip-text text-transparent bg-gradient-to-r from-indigo-400 via-cyan-400 to-indigo-400 animate-title-gradient tracking-tight">
                    Ranking DBV
                </h1>
            </div>
            <p class="text-slate-400 max-w-lg mx-auto text-sm sm:text-base leading-relaxed">
                Acompanhe o saldo rumo ao <span class="text-indigo-400 font-bold">Campori DSA 2027</span>. <br> 
                Meta individual: <span class="text-orange-400 font-bold">R$ 1.200,00</span>.
            </p>
        </header>

        <!-- DASHBOARD GERAL -->
        <section class="mb-12 animate-entrance" style="animation-delay: 0.15s">
            
            <div class="glass-panel rounded-2xl p-6 text-center mb-6 border-t border-indigo-500/30 shadow-[0_0_20px_rgba(99,102,241,0.15)] relative overflow-hidden">
                <div class="absolute inset-0 bg-gradient-to-b from-indigo-500/10 to-transparent pointer-events-none"></div>
                <h2 class="text-sm uppercase tracking-widest text-slate-400 font-bold mb-2 relative z-10 flex items-center justify-center gap-2">
                    <svg class="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    Fundo de Caixa Coletivo
                </h2>
                <div class="text-4xl sm:text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-cyan-400 relative z-10" id="total-arrecadado">
                    R$ 0,00
                </div>
            </div>

            <!-- MINI CARDS COM PROGRESSO SEQUENCIAL -->
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                
                <!-- Inscrição -->
                <div class="glass-panel rounded-xl p-4 border-t border-emerald-500/30 relative overflow-hidden flex flex-col justify-between h-32">
                    <div>
                        <div class="flex justify-between items-start">
                            <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Inscrição</h3>
                            <span class="text-[10px] font-black text-emerald-400 bg-emerald-400/10 px-1.5 rounded">100%</span>
                        </div>
                        <div class="text-lg font-black text-emerald-400 mt-1">CONCLUÍDO</div>
                    </div>
                    <div class="space-y-1.5">
                        <div class="flex justify-between text-[9px] text-slate-500 font-bold uppercase">
                            <span>Status</span>
                            <span>PAGO</span>
                        </div>
                        <div class="w-full h-1.5 bg-slate-900 rounded-full overflow-hidden">
                            <div class="progress-fill h-full bg-emerald-500 rounded-full" style="width: 100%"></div>
                        </div>
                    </div>
                </div>

                <!-- Ônibus -->
                <div class="glass-panel rounded-xl p-4 border-t border-amber-500/30 relative overflow-hidden flex flex-col justify-between h-32">
                    <div>
                        <div class="flex justify-between items-start">
                            <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Ônibus</h3>
                            <span id="percent-onibus" class="text-[10px] font-black text-amber-400 bg-amber-400/10 px-1.5 rounded">0%</span>
                        </div>
                        <div class="text-lg font-black text-amber-400 mt-1" id="val-onibus">R$ 0</div>
                    </div>
                    <div class="space-y-1.5">
                        <div class="flex justify-between text-[9px] text-slate-500 font-bold uppercase">
                            <span>Arrecadado</span>
                            <span>Meta: R$ 11.250</span>
                        </div>
                        <div class="w-full h-1.5 bg-slate-900 rounded-full overflow-hidden">
                            <div id="bar-onibus" class="progress-fill h-full bg-amber-500 rounded-full" style="width: 0%"></div>
                        </div>
                    </div>
                </div>

                <!-- Alimentação -->
                <div class="glass-panel rounded-xl p-4 border-t border-rose-500/30 relative overflow-hidden flex flex-col justify-between h-32">
                    <div>
                        <div class="flex justify-between items-start">
                            <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Alimentação</h3>
                            <span id="percent-alimentacao" class="text-[10px] font-black text-rose-400 bg-rose-400/10 px-1.5 rounded">0%</span>
                        </div>
                        <div class="text-lg font-black text-rose-400 mt-1" id="val-alimentacao">R$ 0</div>
                    </div>
                    <div class="space-y-1.5">
                        <div class="flex justify-between text-[9px] text-slate-500 font-bold uppercase">
                            <span>Arrecadado</span>
                            <span>Meta: R$ 6.750</span>
                        </div>
                        <div class="w-full h-1.5 bg-slate-900 rounded-full overflow-hidden">
                            <div id="bar-alimentacao" class="progress-fill h-full bg-rose-500 rounded-full" style="width: 0%"></div>
                        </div>
                    </div>
                </div>

            </div>
        </section>

        <!-- LISTA DE RANKING -->
        <div id="ranking-list"></div>
    </main>

    <script>
        // Configurações
        const GOAL_INDIVIDUAL = 1200;
        const GOAL_ONIBUS = 11250;
        const GOAL_ALIMENTACAO = 6750;
        
        const ITEM_HEIGHT = 105;
        const ITEM_GAP = 16;
        
        const formatMoney = (value) => {
            return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL', maximumFractionDigits: 0 }).format(value);
        };
        
        // Dados Atualizados
        let dbvs = [
            { id: 1, name: 'Clara Pontharelo', score: 415, monthlyGoal: 0, currentMonthDeposited: 415 },
            { id: 2, name: 'Lara', score: 290, monthlyGoal: 0, currentMonthDeposited: 90 },
            { id: 3, name: 'Irlan', score: 212, monthlyGoal: 0, currentMonthDeposited: 192 },
            { id: 5, name: 'Rafael', score: 236, monthlyGoal: 0, currentMonthDeposited: 34 },
            { id: 6, name: 'Anne Karoline', score: 94, monthlyGoal: 0, currentMonthDeposited: 34 },
            { id: 7, name: 'Arthur', score: 130, monthlyGoal: 0, currentMonthDeposited: 130 },
            { id: 8, name: 'Akilles Carvalho Maciel', score: 0, monthlyGoal: 0, currentMonthDeposited: 20 },
            { id: 9, name: 'Pedro Henrique', score: 147, monthlyGoal: 0, currentMonthDeposited: 127 },
            { id: 11, name: 'Sophia', score: 0, monthlyGoal: 0, currentMonthDeposited: 0 },
            { id: 12, name: 'Valter', score: 32, monthlyGoal: 0, currentMonthDeposited: 32 },
            { id: 13, name: 'Gabriel', score: 0, monthlyGoal: 0, currentMonthDeposited: 0 },
            { id: 14, name: 'Guilherme', score: 0, monthlyGoal: 0, currentMonthDeposited: 0 },
            { id: 15, name: 'Heitor', score: 0, monthlyGoal: 0, currentMonthDeposited: 0 },
            { id: 16, name: 'Valentina', score: 0, monthlyGoal: 0, currentMonthDeposited: 0 },
            { id: 17, name: 'Carlos', score: 32, monthlyGoal: 0, currentMonthDeposited: 32 },
            { id: 18, name: 'Renato', score: 0, monthlyGoal: 0, currentMonthDeposited: 0 },
            { id: 19, name: 'Aislânio', score: 98, monthlyGoal: 0, currentMonthDeposited: 98 }
        ];

        const container = document.getElementById('ranking-list');

        const icons = {
            flame: `<svg class="w-8 h-8 animate-flame relative z-10" viewBox="0 0 24 24" fill="currentColor"><path d="M8.5 14.5A2.5 2.5 0 0011 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 11-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 002.5 2.5z"/></svg>`,
            trophy: `<svg class="w-7 h-7 text-slate-300" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>`,
            medal: `<svg class="w-7 h-7 text-amber-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="17" r="5"/><path d="M7.21 15 2.66 7.14a2 2 0 0 1 .13-2.2L4.4 2.8A2 2 0 0 1 6 2h12a2 2 0 0 1 1.6.8l1.6 2.14a2 2 0 0 1 .14 2.2L16.79 15"/></svg>`,
            star: `<svg class="w-6 h-6 text-slate-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>`
        };

        function animateValue(obj, start, end, duration, formatter) {
            let startTimestamp = null;
            const step = (timestamp) => {
                if (!startTimestamp) startTimestamp = timestamp;
                const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                const easeOut = 1 - Math.pow(1 - progress, 4);
                const currentVal = start + (end - start) * easeOut;
                obj.textContent = formatter ? formatter(currentVal) : Math.floor(currentVal);
                if (progress < 1) window.requestAnimationFrame(step);
            };
            window.requestAnimationFrame(step);
        }

        function createSparks() {
            let sparksHTML = '';
            for(let i=0; i<5; i++) {
                const left = Math.random() * 100;
                const delay = Math.random() * 2;
                sparksHTML += `<div class="spark" style="left: ${left}%; animation: sparkUp 1.5s infinite linear; animation-delay: ${delay}s;"></div>`;
            }
            return sparksHTML;
        }

        function updateMiniCards(total) {
            let remaining = total;

            // Ônibus - Prioridade Atual
            const onibusAllocated = Math.min(remaining, GOAL_ONIBUS);
            const percOnibus = (onibusAllocated / GOAL_ONIBUS) * 100;
            document.getElementById('bar-onibus').style.width = `${percOnibus}%`;
            document.getElementById('percent-onibus').textContent = `${Math.floor(percOnibus)}%`;
            document.getElementById('val-onibus').textContent = formatMoney(onibusAllocated);
            remaining -= onibusAllocated;

            // Alimentação - Próxima Prioridade
            const alimAllocated = Math.min(remaining, GOAL_ALIMENTACAO);
            const percAlim = (alimAllocated / GOAL_ALIMENTACAO) * 100;
            document.getElementById('bar-alimentacao').style.width = `${percAlim}%`;
            document.getElementById('percent-alimentacao').textContent = `${Math.floor(percAlim)}%`;
            document.getElementById('val-alimentacao').textContent = formatMoney(alimAllocated);
        }

        function sortAndRender(initialLoad = false) {
            dbvs.sort((a, b) => b.score - a.score);
            container.style.height = `${dbvs.length * (ITEM_HEIGHT + ITEM_GAP)}px`;

            const totalArrecadado = dbvs.reduce((acc, curr) => acc + curr.score, 0);
            animateValue(document.getElementById('total-arrecadado'), 0, totalArrecadado, 2000, formatMoney);
            updateMiniCards(totalArrecadado);

            dbvs.forEach((dbv, index) => {
                let wrapperEl = document.getElementById(`dbv-wrapper-${dbv.id}`);
                const percentage = Math.min((dbv.score / GOAL_INDIVIDUAL) * 100, 100);

                if (!wrapperEl) {
                    wrapperEl = document.createElement('div');
                    wrapperEl.id = `dbv-wrapper-${dbv.id}`;
                    wrapperEl.className = 'ranking-item-wrapper';
                    
                    // Lógica do Badge
                    const statusText = dbv.currentMonthDeposited > 0 ? "Em dia" : (dbv.monthlyGoal === 0 ? "Aguardando" : "Pendente");
                    const statusColor = dbv.currentMonthDeposited > 0 ? "emerald" : "rose";

                    wrapperEl.innerHTML = `
                        <div class="animate-entrance" style="animation-delay: ${0.2 + (index * 0.1)}s; height: 100%;">
                            <div class="inner-card glass-panel rounded-2xl p-4 flex flex-col justify-center overflow-hidden">
                                <div class="particles-container absolute inset-0 pointer-events-none opacity-0 transition-opacity duration-700">
                                    ${createSparks()}
                                </div>
                                
                                <div class="flex items-center justify-between mb-3 relative z-10">
                                    <div class="flex items-center space-x-3">
                                        <div class="rank-number text-2xl font-black text-slate-700/40 w-8 text-center tabular-nums"></div>
                                        <div class="icon-container flex items-center justify-center w-8 h-8"></div>
                                        <div class="flex flex-col min-w-0">
                                            <h3 class="text-base font-bold text-slate-100 truncate">${dbv.name}</h3>
                                            <div class="flex items-center gap-2 mt-0.5">
                                                <span class="score-text text-sm text-indigo-300 font-bold" data-val="0">R$ 0</span>
                                                <span class="text-[10px] text-slate-500 font-medium">/ ${formatMoney(GOAL_INDIVIDUAL)}</span>
                                                <span class="px-1.5 py-0.5 bg-${statusColor}-500/20 text-${statusColor}-400 rounded text-[9px] uppercase font-bold border border-${statusColor}-500/10">${statusText}</span>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="text-right hidden sm:block">
                                        <div class="text-sm font-black text-slate-200 percentage-text">0%</div>
                                        <div class="text-[9px] text-slate-500 uppercase font-bold">Meta Individual</div>
                                    </div>
                                </div>

                                <div class="w-full h-2 bg-slate-900/80 rounded-full overflow-hidden border border-slate-800 relative z-10">
                                    <div class="progress-fill h-full rounded-full w-0"></div>
                                </div>
                            </div>
                        </div>
                    `;
                    container.appendChild(wrapperEl);
                }

                const innerCard = wrapperEl.querySelector('.inner-card');
                const particles = wrapperEl.querySelector('.particles-container');
                wrapperEl.style.transform = `translateY(${index * (ITEM_HEIGHT + ITEM_GAP)}px)`;
                
                if (index === 0) {
                    innerCard.style.borderColor = 'rgba(249, 115, 22, 0.3)';
                    particles.style.opacity = '1';
                }

                setTimeout(() => {
                    const progressBar = wrapperEl.querySelector('.progress-fill');
                    const scoreText = wrapperEl.querySelector('.score-text');
                    const iconContainer = wrapperEl.querySelector('.icon-container');
                    const rankNumber = wrapperEl.querySelector('.rank-number');
                    const percText = wrapperEl.querySelector('.percentage-text');

                    rankNumber.textContent = `#${index + 1}`;
                    if(index === 0) rankNumber.classList.add('text-orange-500/80');

                    const currentVal = parseInt(scoreText.getAttribute('data-val'));
                    if (currentVal !== dbv.score) {
                        animateValue(scoreText, currentVal, dbv.score, 1500, formatMoney);
                        scoreText.setAttribute('data-val', dbv.score);
                    }
                    
                    percText.textContent = `${Math.floor(percentage)}%`;
                    progressBar.style.width = `${percentage}%`;
                    progressBar.className = `progress-fill h-full rounded-full ${percentage >= 100 ? 'bg-amber-400 shadow-[0_0_10px_rgba(251,191,36,0.4)]' : 'bg-indigo-500'}`;
                    
                    let icon = icons.star;
                    if(index === 0) icon = icons.flame;
                    else if(index === 1) icon = icons.trophy;
                    else if(index === 2) icon = icons.medal;
                    iconContainer.innerHTML = icon;

                }, 100);
            });
        }

        window.addEventListener('DOMContentLoaded', () => sortAndRender(true));
    </script>
</body>
</html>
